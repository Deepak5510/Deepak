<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <radialGradient id="crtaRedGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1000" height="650" fill="#07090e"/>
  <rect width="1000" height="650" fill="url(#crtaRedGlow)"/>

  <!-- Red Cyber Splash Geometry on Right -->
  <path d="M 650 0 L 1000 0 L 1000 350 L 800 200 L 880 120 L 720 180 Z" fill="#b91c1c" opacity="0.85"/>
  <path d="M 820 150 L 1000 80 L 1000 480 L 900 380 L 920 520 L 750 650 L 700 650 L 780 480 Z" fill="#991b1b" opacity="0.9"/>
  <path d="M 850 450 L 1000 400 L 1000 650 L 800 650 Z" fill="#7f1d1d"/>

  <!-- Left Header: CWL Logo -->
  <g transform="translate(60, 50)">
    <circle cx="22" cy="22" r="18" fill="none" stroke="#00f0ff" stroke-width="4"/>
    <text x="48" y="29" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1">CWL</text>
    <text x="49" y="41" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">CyberWarfare Labs</text>
  </g>

  <!-- CRTA Big Badge -->
  <text x="60" y="210" fill="#ef4444" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="2">CRTA</text>

  <!-- Certificate Subtitle -->
  <text x="60" y="275" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="500">This is to certify that</text>

  <!-- Recipient Name -->
  <text x="60" y="360" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="800">Deepak P</text>
  <line x1="60" y1="385" x2="550" y2="385" stroke="#dc2626" stroke-width="2"/>

  <!-- Qualification Body -->
  <text x="60" y="425" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="500">is officially recognized as a</text>
  <text x="60" y="460" fill="#ef4444" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1">CERTIFIED RED TEAM ANALYST - CRTA</text>
  <text x="60" y="495" fill="#cbd5e1" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14">Upon successfully completing all the requirements of the Certification Examination.</text>

  <!-- Signatory & Badges -->
  <g transform="translate(60, 560)">
    <circle cx="25" cy="0" r="22" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="4" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="800">CWL</text>
    
    <!-- Signature Line -->
    <text x="280" y="-12" text-anchor="middle" fill="#ffffff" font-family="'Brush Script MT', cursive, italic" font-size="24">Manish</text>
    <line x1="180" y1="5" x2="380" y2="5" stroke="#64748b" stroke-width="1.5"/>
    <text x="280" y="22" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700">MANISH GUPTA</text>
    <text x="280" y="37" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11">Director, Cyberwarfare Labs</text>
  </g>

  <!-- Right Red Seal Badge -->
  <g transform="translate(800, 430)">
    <circle cx="0" cy="0" r="68" fill="#18070a" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="58" fill="#2d0b11" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="-18" y="-10" width="36" height="28" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M -10 -10 V -18 C -10 -24, 10 -24, 10 -18 V -10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="2" r="3" fill="#ffffff"/>
    <text x="0" y="42" text-anchor="middle" fill="#ef4444" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">RED TEAM ANALYST</text>
  </g>

  <!-- Certificate ID & Date Box -->
  <g transform="translate(680, 550)">
    <rect width="260" height="50" rx="6" fill="#141824" stroke="#334155" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CRTA-69e4be6fc705942f0b44cfa7</text>
    <text x="130" y="40" text-anchor="middle" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">04/19/2026</text>
  </g>
</svg>
