<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#certBg)"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#d97706" stroke-width="3" rx="8"/>
  <rect x="30" y="30" width="740" height="500" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6 4" rx="6"/>
  <rect x="38" y="38" width="724" height="484" fill="none" stroke="#d97706" stroke-width="1" rx="4"/>

  <!-- Trophy Icon -->
  <g transform="translate(370, 55)">
    <circle cx="30" cy="30" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M 22 22 H 38 V 32 C 38 37 34 40 30 40 C 26 40 22 37 22 32 Z M 22 25 H 17 C 15.5 25 15.5 29 17 31 H 22 M 38 25 H 43 C 44.5 25 44.5 29 43 31 H 38 M 30 40 V 44 M 24 44 H 36" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="400" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="2">NATIONAL INNOVATION HACKATHON</text>
  <text x="400" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#d97706" letter-spacing="3">CERTIFICATE OF EXCELLENCE</text>

  <text x="400" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" fill="#64748b">AWARDED TO</text>
  
  <!-- Recipient Name -->
  <text x="400" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Deepak</text>
  <line x1="220" y1="285" x2="580" y2="285" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Certificate Details -->
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#d97706">OUTSTANDING HACKATHON PERFORMANCE</text>
  <text x="400" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" fill="#334155">
    In recognition of remarkable engineering innovation, rapid software prototyping,
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" fill="#334155">
    and exceptional collaboration in developing secure, high-impact web solutions.
  </text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(90, 430)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">HACKATHON LEAD JURY</text>
    <text x="80" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-style="italic" fill="#0f172a">Marcus Chen</text>
  </g>

  <!-- Center Verified Seal -->
  <g transform="translate(360, 410)">
    <circle cx="40" cy="40" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="40" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#d97706" letter-spacing="1">EXCELLENCE</text>
    <text x="40" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" fill="#b45309">HONOR</text>
  </g>

  <g transform="translate(550, 430)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">DATE OF EVENT</text>
    <text x="80" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Verified 2026</text>
  </g>
</svg>
