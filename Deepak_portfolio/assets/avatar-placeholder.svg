<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d9be"/>
      <stop offset="100%" stop-color="#eec5a2"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGradient)" stroke="#bfdbfe" stroke-width="3"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Body / Hoodie / Jacket -->
  <!-- Shoulders -->
  <path d="M 65 310 C 75 240, 115 210, 160 210 C 205 210, 245 240, 255 310 Z" fill="#1e293b"/>
  <!-- T-Shirt / Collar -->
  <path d="M 125 210 C 135 245, 185 245, 195 210 Z" fill="#2563eb"/>
  <path d="M 140 210 C 145 230, 175 230, 180 210 Z" fill="url(#skinGrad)"/>

  <!-- Neck -->
  <rect x="144" y="170" width="32" height="42" rx="6" fill="url(#skinGrad)"/>

  <!-- Head Base -->
  <ellipse cx="160" cy="138" rx="46" ry="52" fill="url(#skinGrad)"/>

  <!-- Modern Haircut -->
  <path d="M 112 125 C 110 85, 135 68, 160 68 C 190 68, 210 85, 208 125 C 204 95, 185 82, 160 82 C 135 82, 116 95, 112 125 Z" fill="#0f172a"/>
  <!-- Top hair texture -->
  <path d="M 120 102 C 135 75, 180 75, 200 96 C 195 86, 175 74, 160 74 C 140 74, 126 84, 120 102 Z" fill="#1e293b"/>

  <!-- Glasses -->
  <rect x="124" y="126" width="28" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3"/>
  <rect x="168" y="126" width="28" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="152" y1="135" x2="168" y2="135" stroke="#0f172a" stroke-width="3"/>
  <line x1="116" y1="134" x2="124" y2="134" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="196" y1="134" x2="204" y2="134" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Eyes behind glasses -->
  <circle cx="138" cy="136" r="3.5" fill="#0f172a"/>
  <circle cx="182" cy="136" r="3.5" fill="#0f172a"/>

  <!-- Eyebrows -->
  <path d="M 125 118 Q 138 114 150 118" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 170 118 Q 182 114 195 118" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile -->
  <path d="M 146 160 Q 160 172 174 160" stroke="#9a3412" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Graduation Cap Badge / Tech Shield Pin -->
  <g transform="translate(210, 208)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="20" cy="20" r="18" fill="#eff6ff"/>
    <!-- Shield & checkmark -->
    <path d="M 20 10 L 29 14 V 20 C 29 25 25 29 20 31 C 15 29 11 25 11 20 V 14 Z" fill="#2563eb"/>
    <path d="M 16 20 L 19 23 L 24 17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
