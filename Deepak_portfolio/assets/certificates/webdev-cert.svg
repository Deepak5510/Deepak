<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#certBg)"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#2563eb" stroke-width="3" rx="8"/>
  <rect x="30" y="30" width="740" height="500" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4" rx="6"/>
  <rect x="38" y="38" width="724" height="484" fill="none" stroke="#2563eb" stroke-width="1" rx="4"/>

  <!-- Badge Icon -->
  <g transform="translate(370, 55)">
    <circle cx="30" cy="30" r="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 22 24 L 16 30 L 22 36 M 38 24 L 44 30 L 38 36 M 33 22 L 27 38" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title -->
  <text x="400" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="2">WEB ENGINEERING INSTITUTE</text>
  <text x="400" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#2563eb" letter-spacing="3">PROFESSIONAL CERTIFICATION</text>

  <text x="400" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" fill="#64748b">THIS CREDENTIAL CONFIRMS THAT</text>
  
  <!-- Recipient Name -->
  <text x="400" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Deepak</text>
  <line x1="220" y1="285" x2="580" y2="285" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Certificate Details -->
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="700" fill="#2563eb">WEB DEVELOPMENT PROFESSIONAL CERTIFICATION</text>
  <text x="400" y="348" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" fill="#334155">
    Successfully completed comprehensive examination in Modern Full-Stack Web Architecture,
  </text>
  <text x="400" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" fill="#334155">
    Responsive User Interface Systems, RESTful API Development, and Secure Web Standards.
  </text>

  <!-- Bottom Verification Footer -->
  <g transform="translate(90, 430)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">CHAIR OF EVALUATION</text>
    <text x="80" y="30" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-style="italic" fill="#0f172a">Prof. K. Reynolds</text>
  </g>

  <!-- Center Verified Seal -->
  <g transform="translate(360, 410)">
    <circle cx="40" cy="40" r="36" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="40" cy="40" r="30" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="40" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#2563eb" letter-spacing="1">VERIFIED</text>
    <text x="40" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="700" fill="#1d4ed8">FULL-STACK</text>
  </g>

  <g transform="translate(550, 430)">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <text x="80" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">DATE OF ISSUANCE</text>
    <text x="80" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Verified 2026</text>
  </g>
</svg>
