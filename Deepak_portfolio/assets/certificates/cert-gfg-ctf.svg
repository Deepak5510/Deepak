<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="gfgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafa"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#gfgBg)"/>

  <!-- Geometric Orange / Dark Brown Framing like real certificate -->
  <!-- Left Side Triangles -->
  <polygon points="0,0 200,0 0,650" fill="#9a3412"/>
  <polygon points="0,0 150,0 0,400" fill="#ea580c"/>
  <polygon points="0,200 120,400 0,550" fill="#f97316" opacity="0.8"/>
  <polygon points="0,450 160,700 0,700" fill="#c2410c"/>

  <!-- Right Side Triangles -->
  <polygon points="1000,700 800,700 1000,200" fill="#9a3412"/>
  <polygon points="1000,500 850,700 1000,700" fill="#ea580c"/>
  <polygon points="1000,250 880,450 1000,600" fill="#f97316" opacity="0.8"/>

  <!-- Small floating polygon accents -->
  <polygon points="80,320 120,340 90,380" fill="#fed7aa"/>
  <polygon points="900,280 940,320 920,360" fill="#fed7aa"/>

  <!-- Header Right: GFG Student Chapter KSRIET -->
  <g transform="translate(760, 40)">
    <!-- Graduation Cap / GFG icon -->
    <path d="M 50 15 L 75 25 L 50 35 L 25 25 Z" fill="#0f172a"/>
    <path d="M 33 28 V 40 C 33 46, 67 46, 67 40 V 28" fill="#0f172a"/>
    <line x1="72" y1="26" x2="72" y2="42" stroke="#0f172a" stroke-width="2"/>
    <circle cx="72" cy="44" r="2" fill="#0f172a"/>
    <!-- GFG green logo -->
    <text x="50" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#059669">}{</text>
    <text x="50" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Student Chapter</text>
    <text x="50" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">KSRIET</text>
  </g>

  <!-- Certificate Title -->
  <text x="500" y="160" text-anchor="middle" font-family="'Times New Roman', serif" font-size="44" font-weight="bold" fill="#0f172a" letter-spacing="2">CERTIFICATE</text>
  <text x="500" y="200" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-style="italic" fill="#0f172a">of Participation</text>

  <text x="500" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" fill="#334155">This certificate is proudly presented to :</text>

  <!-- Recipient Name -->
  <text x="500" y="335" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="36" font-weight="800" fill="#0f172a">Deepak.P</text>
  <line x1="260" y1="355" x2="740" y2="355" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Institution -->
  <text x="280" y="395" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" fill="#334155">of</text>
  <text x="500" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">KSR Institute For Engineering and Technology</text>
  <line x1="300" y1="405" x2="730" y2="405" stroke="#94a3b8" stroke-width="1"/>

  <!-- Event Details -->
  <text x="500" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" fill="#334155">
    has Participated in the <tspan font-weight="800" fill="#0f172a">Capture the Flag (CTF)</tspan> which was held on
  </text>
  <text x="500" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" fill="#334155">
    27/03/2025 conducted by <tspan font-weight="800" fill="#059669">GFG Student Chapter - KSRIET.</tspan>
  </text>

  <!-- Signatories -->
  <g transform="translate(250, 560)">
    <line x1="0" y1="30" x2="140" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="'Brush Script MT', cursive" font-size="20">A.S. Bose</text>
    <text x="70" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">BOSE A S</text>
    <text x="70" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#64748b">Founder</text>
    <text x="70" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#64748b">GFG - KSRIET</text>
  </g>

  <g transform="translate(430, 560)">
    <line x1="0" y1="30" x2="140" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="'Brush Script MT', cursive" font-size="20">M. Arif</text>
    <text x="70" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">MOHAMMED ARIF A</text>
    <text x="70" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#64748b">President</text>
    <text x="70" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#64748b">GFG - KSRIET</text>
  </g>

  <g transform="translate(610, 560)">
    <line x1="0" y1="30" x2="140" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="'Brush Script MT', cursive" font-size="20">R. Dharan</text>
    <text x="70" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a">DHARAN R</text>
    <text x="70" y="64" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" fill="#64748b">Cyber Security Lead</text>
    <text x="70" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" fill="#64748b">GFG - KSRIET</text>
  </g>
</svg>
